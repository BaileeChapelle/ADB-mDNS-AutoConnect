name: "PowerShell Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 1' # 每周一定时扫一次

jobs:
  analyze:
    name: Run PSScriptAnalyzer
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # 关键：让扫描结果可以写入仓库的 Security 面板

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer and generate SARIF report
        uses: microsoft/psscriptanalyzer-action@v1.1
        with:
          path: ".\/"
          recurse: true
          # 包含所有严重级别的警告与安全问题
          severity: '"Error", "Warning"'
          # 导出为 SARIF 格式，供 GitHub Security 面板读取
          output: "results.sarif"

      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "results.sarif"
